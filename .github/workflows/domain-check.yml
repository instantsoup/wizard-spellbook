name: Domain check (temporary)
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in majesticfacesweater.com www.majesticfacesweater.com; do
            for t in A AAAA CNAME; do echo "== $h $t: $(dig +short $h $t | tr '\n' ' ')"; done
          done
          echo "== NS: $(dig +short NS majesticfacesweater.com | tr '\n' ' ')"
          for u in http://majesticfacesweater.com/wizard-spellbook/ https://majesticfacesweater.com/wizard-spellbook/ https://majesticfacesweater.com/ https://www.majesticfacesweater.com/wizard-spellbook/ https://majesticfacesweater.com/wizard-spellbook/data/spells/manifest.json https://majesticfacesweater.com/wizard-spellbook/manifest.webmanifest; do
            echo "== $u"; curl -sS -m 20 -o /dev/null -D - "$u" 2>&1 | grep -iE '^(HTTP|location|server|content-type|curl)' || echo "(no response)"
          done
          echo "== certificate"; echo | openssl s_client -connect majesticfacesweater.com:443 -servername majesticfacesweater.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | head -5
